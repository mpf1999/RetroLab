services:
  postgres:
    container_name: postgres-backend-api
    image: postgres:17
    environment:
      POSTGRES_DB: backend_api
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5332:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data: